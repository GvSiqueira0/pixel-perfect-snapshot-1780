services:
  # Production image: builds the app (nitro node-server) and serves it on :3000
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pixel-perfect-snapshot:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Development with hot reload: `docker compose --profile dev up`
  # Runs Vite dev server on :8080 (host "::" is set by the Lovable config).
  dev:
    image: docker.io/oven/bun:1
    working_dir: /app
    command: sh -c "bun install && bun run dev"
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - ./:/app
      # Keep container node_modules isolated from the host
      - node_modules:/app/node_modules
    ports:
      - "8080:8080"
    profiles:
      - dev

volumes:
  node_modules:
